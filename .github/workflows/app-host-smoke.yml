{
  "name": "Generic application-hosted XCTest check",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "jobs": {
    "app-host": {
      "if": "github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.event.repository.private == false",
      "runs-on": "macos-26",
      "timeout-minutes": 20,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.4.1.app/Contents/Developer",
        "PROBE_XCODE_VERSION": "26.4.1",
        "PROBE_ARCH": "arm64"
      },
      "steps": [
        {
          "name": "Compile and run only three generic application-hosted tests",
          "run": "python3 - <<'PY'\n\"\"\"Generic public-runner health probe. No application, credentials, or user data.\n\nRuns only embedded generic toy fixtures. No private application is included.\n\"\"\"\nimport json\nimport os\nimport platform\nimport re\nimport signal\nimport subprocess\nimport sys\nimport time\n\nRUNTIME = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'\nEXPECTED_VERSION = os.environ.get('PROBE_XCODE_VERSION','26.4.1')\nEXPECTED_ARCH = os.environ.get('PROBE_ARCH','x86_64')\nEXPECTED_BUILDS = {'26.3':'17C529','26.4.1':'17E202'}\n\n\ndef redact(text):\n    text=re.sub(r'\\b[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}\\b','<simulator>',text)\n    return re.sub(r'/Users/[^/\\s]+','/Users/<runner>',text)\n\n\nclass ProbeStopped(RuntimeError):\n    pass\n\n\ndef stop_child(child, captured=''):\n    \"\"\"Bound cleanup of this probe's child even if macOS rejects group signals.\"\"\"\n    signal_errors=[]\n    for group_signal,direct_signal in [(signal.SIGTERM,child.terminate),(signal.SIGKILL,child.kill)]:\n        try:\n            os.killpg(child.pid,group_signal)\n        except ProcessLookupError:\n            pass\n        except PermissionError:\n            try:direct_signal()\n            except (ProcessLookupError,PermissionError) as error:\n                signal_errors.append(type(error).__name__)\n        try:\n            output,_=child.communicate(timeout=2)\n            return output or captured,signal_errors\n        except subprocess.TimeoutExpired as error:\n            if error.output:captured=error.output\n    if isinstance(captured,bytes):captured=captured.decode('utf-8',errors='replace')\n    return captured,signal_errors+['child did not exit during bounded cleanup']\n\n\nclass Probe:\n    def __init__(self):\n        self.started=time.monotonic()\n        self.deadline=self.started+720\n        self.cleanup_deadline=self.started+780\n        self.device=None\n        self.boot_ready=False\n        self.stages=[]\n\n    def run(self,label,args,limit):\n        remaining=(self.cleanup_deadline if label=='shutdown' else self.deadline)-time.monotonic()\n        if remaining<=0:\n            raise ProbeStopped('Overall health-probe deadline reached')\n        begin=time.monotonic()\n        end=begin+min(limit,remaining)\n        print(json.dumps({'stage':label,'event':'started','elapsedSeconds':round(begin-self.started,2)}),flush=True)\n        child=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,start_new_session=True)\n        while True:\n            try:\n                output,_=child.communicate(timeout=max(.01,min(30,end-time.monotonic())))\n                break\n            except subprocess.TimeoutExpired as partial:\n                captured=partial.output or ''\n                if isinstance(captured,bytes):captured=captured.decode('utf-8',errors='replace')\n                if label=='generic_xctest' and re.search(r\"Test Case '.*?' failed\",captured):\n                    output,errors=stop_child(child,captured)\n                    print(redact(output[-10000:]),flush=True)\n                    self.stages.append({'stage':label,'result':'test failure','seconds':round(time.monotonic()-begin,2)})\n                    raise ProbeStopped('Generic hosted XCTest failed; no automatic retry')\n                if time.monotonic()<end:\n                    print(json.dumps({'stage':label,'event':'waiting','seconds':round(time.monotonic()-begin,2)}),flush=True)\n                    if captured:print(redact(captured[-700:]),flush=True)\n                    continue\n                output,signal_errors=stop_child(child,captured)\n                self.stages.append({'stage':label,'seconds':round(time.monotonic()-begin,2),'result':'timeout'})\n                if signal_errors:print(json.dumps({'stage':label,'cleanupSignalErrors':signal_errors}),flush=True)\n                print(redact(output[-1500:]),flush=True)\n                raise ProbeStopped(label+' timed out; no automatic retry')\n        elapsed=round(time.monotonic()-begin,2)\n        self.stages.append({'stage':label,'seconds':elapsed,'result':child.returncode})\n        print(json.dumps(self.stages[-1]),flush=True)\n        if child.returncode:\n            print(redact(output[-1500:]),flush=True)\n            raise ProbeStopped(label+' failed')\n        return output\n\n    def check(self):\n        version=self.run('selected_xcode',['xcodebuild','-version'],30).strip()\n        print(version,flush=True)\n        if EXPECTED_VERSION not in EXPECTED_BUILDS:\n            raise ProbeStopped('Unreviewed Xcode version')\n        expected='Xcode '+EXPECTED_VERSION+'\\nBuild version '+EXPECTED_BUILDS[EXPECTED_VERSION]\n        if EXPECTED_ARCH not in ('x86_64','arm64') or version!=expected or platform.system()!='Darwin' or platform.machine()!=EXPECTED_ARCH:\n            raise ProbeStopped('Unexpected toolchain or runner architecture')\n        print('macOS '+self.run('host_os',['sw_vers','-productVersion'],15).strip(),flush=True)\n        print(json.dumps({'hostImage':{k:os.environ.get(k) for k in ['ImageOS','ImageVersion','RUNNER_ARCH']}}),flush=True)\n        self.resources('before_boot')\n        data=json.loads(self.run('available_simulators',['xcrun','simctl','list','devices','available','-j'],180))\n        candidates=[d for d in data['devices'].get(RUNTIME,[]) if d.get('isAvailable') and d['name']=='iPhone 17']\n        if len(candidates)!=1 or candidates[0]['state']!='Shutdown':\n            raise ProbeStopped('Expected one fresh Shutdown iPhone17 under the pinned iOS26.2 runtime')\n        self.device=candidates[0]['udid']\n        self.run('boot',['xcrun','simctl','boot',self.device],60)\n        self.run('boot_ready',['xcrun','simctl','bootstatus',self.device,'-b'],600)\n        self.boot_ready=True\n        self.resources('after_boot')\n        print('SIMULATOR_READY: environment only; no application or XCTest has been tested.',flush=True)\n\n    def resources(self,phase):\n        commands=[('pages',['vm_stat']),('disk',['df','-k','/']),\n                  ('simulator_processes',['ps','-axo','comm=,stat=,rss=,%cpu='])]\n        # The swap sysctl stalled after boot in the first observation. Do not\n        # let an optional telemetry read determine simulator readiness.\n        if phase=='before_boot':commands.insert(0,('memory',['sysctl','hw.memsize','hw.ncpu','vm.swapusage']))\n        for label,args in commands:\n            try:\n                output=self.run(phase+'_'+label,args,10)\n                if label=='simulator_processes':\n                    output='\\n'.join(line for line in output.splitlines() if re.search(r'CoreSimulator|simdiskimaged|launchd_sim|SpringBoard|backboardd',line))\n                print(json.dumps({'snapshot':phase,'kind':label,'text':redact(output[-4000:])}),flush=True)\n            except (ProbeStopped,OSError,subprocess.TimeoutExpired) as error:\n                print(json.dumps({'snapshot':phase,'kind':label,'unavailable':str(error)}),flush=True)\n\n    def execute(self):\n        failure=None\n        try:\n            self.check()\n        except (ProbeStopped,ValueError,KeyError,OSError,subprocess.TimeoutExpired) as error:\n            failure=error\n        finally:\n            if self.device:\n                try:self.run('shutdown',['xcrun','simctl','shutdown',self.device],45)\n                except (ProbeStopped,OSError,subprocess.TimeoutExpired) as error:\n                    print('Cleanup: '+str(error),flush=True)\n                    if failure is None:failure=error\n        print(json.dumps({'scope':'generic simulator health only','stages':self.stages,\n          'xcode':EXPECTED_VERSION,'runtime':RUNTIME,'architecture':EXPECTED_ARCH,'bootReady':self.boot_ready,\n          'applicationTested':False,'signed':False,'uploaded':False,'automaticRetries':0,\n          'result':'failed' if failure else 'ready'},indent=2),flush=True)\n        if failure:print(str(failure),file=sys.stderr)\n        return 1 if failure else 0\n\n\n\nimport pathlib\nimport tempfile\n\nFIXTURES = {'HostSmoke.xcodeproj/project.pbxproj': '// !$*UTF8*$!\\n{\\n\"archiveVersion\" = 1;\\n\"classes\" = {\\n\\n};\\n\"objectVersion\" = 56;\\n\"objects\" = {\\n\"206D03C7F886C13498490DF0\" = {\\n\"isa\" = \"PBXFileReference\";\\n\"lastKnownFileType\" = \"sourcecode.swift\";\\n\"path\" = \"AppDelegate.swift\";\\n\"sourceTree\" = \"<group>\";\\n};\\n\"AF53B123C223F13684E9EC80\" = {\\n\"isa\" = \"PBXFileReference\";\\n\"lastKnownFileType\" = \"sourcecode.swift\";\\n\"path\" = \"HostSmokeTests.swift\";\\n\"sourceTree\" = \"<group>\";\\n};\\n\"EF6E575659BCF44ECB8DA7E1\" = {\\n\"isa\" = \"PBXFileReference\";\\n\"explicitFileType\" = \"wrapper.application\";\\n\"path\" = \"HostSmoke.app\";\\n\"sourceTree\" = \"BUILT_PRODUCTS_DIR\";\\n};\\n\"1D7BCEB7A84D81271432542F\" = {\\n\"isa\" = \"PBXFileReference\";\\n\"explicitFileType\" = \"wrapper.cfbundle\";\\n\"path\" = \"HostSmokeTests.xctest\";\\n\"sourceTree\" = \"BUILT_PRODUCTS_DIR\";\\n};\\n\"D2BD3A6FFF7C2EAE1A5B44B5\" = {\\n\"isa\" = \"PBXGroup\";\\n\"children\" = (\"206D03C7F886C13498490DF0\");\\n\"path\" = \"App\";\\n\"sourceTree\" = \"<group>\";\\n};\\n\"1FCE4F247A24DED3A8C24A4E\" = {\\n\"isa\" = \"PBXGroup\";\\n\"children\" = (\"AF53B123C223F13684E9EC80\");\\n\"path\" = \"Tests\";\\n\"sourceTree\" = \"<group>\";\\n};\\n\"0A3E27B8CA818264D75C8D81\" = {\\n\"isa\" = \"PBXGroup\";\\n\"children\" = (\"EF6E575659BCF44ECB8DA7E1\",\"1D7BCEB7A84D81271432542F\");\\n\"name\" = \"Products\";\\n\"sourceTree\" = \"<group>\";\\n};\\n\"EC6AE75C017423A0C5A951A8\" = {\\n\"isa\" = \"PBXGroup\";\\n\"children\" = (\"D2BD3A6FFF7C2EAE1A5B44B5\",\"1FCE4F247A24DED3A8C24A4E\",\"0A3E27B8CA818264D75C8D81\");\\n\"sourceTree\" = \"<group>\";\\n};\\n\"2ABA755D289955490137261E\" = {\\n\"isa\" = \"PBXBuildFile\";\\n\"fileRef\" = \"206D03C7F886C13498490DF0\";\\n};\\n\"FC3F1253756451A1F789C58D\" = {\\n\"isa\" = \"PBXBuildFile\";\\n\"fileRef\" = 