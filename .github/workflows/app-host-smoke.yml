ctation) { self.ready = ready }\\n    func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) { ready.fulfill() }\\n}\\n\\nfinal class HostSmokeTests: XCTestCase {\\n    func testBasicHost() { XCTAssertEqual(20 + 22, 42) }\\n\\n    @MainActor\\n    func testUIKitMainActor() throws {\\n        XCTAssertTrue(Thread.isMainThread)\\n        let app = try XCTUnwrap(UIApplication.shared.delegate as? GenericAppDelegate)\\n        let window = try XCTUnwrap(app.window)\\n        XCTAssertFalse(window.isHidden)\\n        XCTAssertNotNil(window.rootViewController?.view.window)\\n    }\\n\\n    @MainActor\\n    func testWebKitJavaScript() throws {\\n        let app = try XCTUnwrap(UIApplication.shared.delegate as? GenericAppDelegate)\\n        let root = try XCTUnwrap(app.window?.rootViewController?.view)\\n        let configuration = WKWebViewConfiguration()\\n        configuration.websiteDataStore = .nonPersistent()\\n        let web = WKWebView(frame: root.bounds, configuration: configuration)\\n        root.addSubview(web)\\n        defer { web.removeFromSuperview() }\\n        XCTAssertNotNil(web.window)\\n        let ready = expectation(description: \"generic visible local page\")\\n        let delegate = GenericPageReady(ready)\\n        web.navigationDelegate = delegate\\n        web.loadHTMLString(\"<html><body>generic probe</body></html>\", baseURL: nil)\\n        guard XCTWaiter.wait(for: [ready], timeout: 40) == .completed else {\\n            XCTFail(\"Generic hosted local page did not load\")\\n            return\\n        }\\n        let checked = expectation(description: \"generic JavaScript callback\")\\n        web.evaluateJavaScript(\"21 * 2\") { result, error in\\n            XCTAssertNil(error)\\n            XCTAssertEqual((result as? NSNumber)?.intValue, 42)\\n            checked.fulfill()\\n        }\\n        wait(for: [checked], timeout: 30)\\n        withExtendedLifetime(delegate) {}\\n    }\\n}\\n', 'HostSmoke.xcodeproj/xcshareddata/x